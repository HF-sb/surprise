<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Particle Heartbeat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // 画布尺寸
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const CANVAS_CENTER_X = CANVAS_WIDTH / 2;
        const CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;
        const IMAGE_ENLARGE = 11;
        const HEART_COLOR = "#ff69a4";

        // 生成心形轮廓基础点
        function heartFunction(t, shrinkRatio = IMAGE_ENLARGE) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            x *= shrinkRatio;
            y *= shrinkRatio;
            x += CANVAS_CENTER_X;
            y += CANVAS_CENTER_Y;
            return { x: Math.floor(x), y: Math.floor(y) };
        }

        // 内部散射
        function scatterInside(x, y, beta = 0.15) {
            let ratioX = -beta * Math.log(Math.random());
            let ratioY = -beta * Math.log(Math.random());
            let dx = ratioX * (x - CANVAS_CENTER_X);
            let dy = ratioY * (y - CANVAS_CENTER_Y);
            return { x: x - dx, y: y - dy };
        }

        // 收缩函数
        function shrink(x, y, ratio) {
            let force = -1 / (Math.pow(Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2), 0.6));
            let dx = ratio * force * (x - CANVAS_CENTER_X);
            let dy = ratio * force * (y - CANVAS_CENTER_Y);
            return { x: x - dx, y: y - dy };
        }

        // 心跳曲线 (人跳动的节奏)
        function curve(p) {
            return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
        }

        // 计算动态位置
        function calcPosition(x, y, ratio) {
            let force = 1 / (Math.pow(Math.pow(x - CANVAS_CENTER_X, 2) + Math.pow(y - CANVAS_CENTER_Y, 2), 0.520));
            let dx = ratio * force * (x - CANVAS_CENTER_X) + (Math.random() * 3 - 1.5);
            let dy = ratio * force * (y - CANVAS_CENTER_Y) + (Math.random() * 3 - 1.5);
            return { x: x - dx, y: y - dy };
        }

        // 初始化点集
        let points = [];
        let edgeDiffusionPoints = [];
        let centerDiffusionPoints = [];
        let allPoints = {}; 
        const GENERATE_FRAME = 20;

        // 构建初始粒子云
        function build(number) {
            for (let i = 0; i < number; i++) {
                let t = Math.random() * Math.PI * 2;
                points.push(heartFunction(t));
            }

            points.forEach(p => {
                for (let i = 0; i < 3; i++) {
                    edgeDiffusionPoints.push(scatterInside(p.x, p.y, 0.05));
                }
            });

            for (let i = 0; i < 4000; i++) {
                let p = points[Math.floor(Math.random() * points.length)];
                centerDiffusionPoints.push(scatterInside(p.x, p.y, 0.17));
            }
        }

        // 计算每一帧
        function calc(frame) {
            let ratio = 10 * curve(frame / 10 * Math.PI);
            let haloRadius = Math.floor(4 + 6 * (1 + curve(frame / 10 * Math.PI)));
            let haloNumber = Math.floor(3000 + 4000 * Math.abs(Math.pow(curve(frame / 10 * Math.PI), 2)));
            
            let currentPoints = [];

            // 1. 光环
            let heartHaloPoint = new Set();
            for (let i = 0; i < haloNumber; i++) {
                let t = Math.random() * Math.PI * 2;
                let p = heartFunction(t, 11.6);
                p = shrink(p.x, p.y, haloRadius);
                let key = `${Math.floor(p.x)},${Math.floor(p.y)}`;
                if (!heartHaloPoint.has(key)) {
                    heartHaloPoint.add(key);
                    p.x += Math.random() * 28 - 14;
                    p.y += Math.random() * 28 - 14;
                    let size = Math.random() < 0.5 ? 1 : 2;
                    currentPoints.push({x: p.x, y: p.y, size: size});
                }
            }

            // 2. 轮廓
            points.forEach(p => {
                let np = calcPosition(p.x, p.y, ratio);
                currentPoints.push({x: np.x, y: np.y, size: Math.floor(Math.random() * 3) + 1});
            });

            // 3. 边缘扩散
            edgeDiffusionPoints.forEach(p => {
                let np = calcPosition(p.x, p.y, ratio);
                currentPoints.push({x: np.x, y: np.y, size: Math.floor(Math.random() * 2) + 1});
            });

            // 4. 中心扩散
            centerDiffusionPoints.forEach(p => {
                let np = calcPosition(p.x, p.y, ratio);
                currentPoints.push({x: np.x, y: np.y, size: Math.floor(Math.random() * 2) + 1});
            });

            allPoints[frame] = currentPoints;
        }

        // 初始化并预计算
        build(2000);
        for (let i = 0; i < GENERATE_FRAME; i++) {
            calc(i);
        }

        // 渲染循环
        let frameCount = 0;
        function animate() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.fillStyle = HEART_COLOR;

            let currentRenderPoints = allPoints[frameCount % GENERATE_FRAME];
            
            currentRenderPoints.forEach(p => {
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            frameCount++;
            
            // 160 毫秒一帧，控制心跳速度
            setTimeout(() => {
                requestAnimationFrame(animate);
            }, 1000 / 60); // 60fps流畅渲染
        }

        // 启动动画
        animate();
    </script>
</body>
</html>
